[package]
name = "aocctl-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "GTK app to change AOC monitor settings on Linux, including AOC-only settings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ManishModak/aocctl"
publish = false

[dependencies]
aocctl = { path = ".." }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
async-channel = "2.5"
