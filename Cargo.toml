[package]
name = "aocctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Control AOC monitor settings on Linux over DDC/CI, including AOC-only settings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ManishModak/aocctl"
keywords = ["aoc", "monitor", "ddc", "ddcci", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml_edit = "0.25.18"

[workspace]
# The GTK app lives in its own crate so the CLI keeps building without GTK (and as a static musl binary).
members = [".", "gui"]
